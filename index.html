        // Custom Hook for Touch Swipes
        function useSwipe(onSwipeLeft, onSwipeRight) {
            const [touchStart, setTouchStart] = useState(null);
            const [touchEnd, setTouchEnd] = useState(null);

            const minSwipeDistance = 50;

            const onTouchStart = (e) => {
                setTouchEnd(null);
                setTouchStart(e.targetTouches[0].clientX);
            };

            const onTouchMove = (e) => setTouchEnd(e.targetTouches[0].clientX);

            const onTouchEnd = () => {
                if (!touchStart || !touchEnd) return;
                const distance = touchStart - touchEnd;
                const isLeftSwipe = distance > minSwipeDistance;
                const isRightSwipe = distance < -minSwipeDistance;
                if (isLeftSwipe && onSwipeLeft) onSwipeLeft();
                if (isRightSwipe && onSwipeRight) onSwipeRight();
            };

            return { onTouchStart, onTouchMove, onTouchEnd };
        }

        // 1. Attention Meter (Slide 1)
        function AttentionMeterWidget() {
            const [deficit, setDeficit] = useState(85);
            const [timerCount, setTimerCount] = useState(8.0);
            const [isCounting, setIsCounting] = useState(false);

            useEffect(() => {
                let interval;
                if (isCounting && timerCount > 0) {
                    interval = setInterval(() => {
                        setTimerCount((prev) => {
                            const next = parseFloat((prev - 0.1).toFixed(1));
                            if (next <= 0) {
                                setIsCounting(false);
                                return 0;
                            }
                            return next;
                        });
                        setDeficit(prev => Math.min(100, prev + 1));
                    }, 100);
                }
                return () => clearInterval(interval);
            }, [isCounting, timerCount]);

            const triggerScan = () => {
                setTimerCount(8.0);
                setDeficit(30);
                setIsCounting(true);
            };

            return (
                <div className="w-full h-full flex flex-col justify-between p-4">
                    <div className="flex items-center justify-between border-b border-slate-200 pb-2">
                        <span className="text-xs font-bold tracking-wider uppercase text-slate-500 flex items-center gap-1">
                            <span className="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></span>
                            Live Filter Simulator
                        </span>
                        <span className="text-xs text-[#6A1B1A] font-bold font-mono">Attention Span: {timerCount}s</span>
                    </div>

                    <div className="flex-1 flex flex-col items-center justify-center gap-6 py-4">
                        {/* Core Gauge */}
                        <div className="relative w-44 h-44 rounded-full border-4 border-[#E8B53D]/30 flex items-center justify-center flex-col shadow-inner bg-white">
                            <div className="absolute inset-0 bg-radial-gradient(circle, rgba(106,27,26,0.05)_0%, transparent_70%)"></div>
                            {/* Inner Ring Glow */}
                            <div className={`absolute w-36 h-36 rounded-full border-2 transition-all duration-300 ${deficit > 80 ? 'border-rose-500/30' : 'border-[#6A1B1A]/20'}`}></div>
                            
                            <span className={`text-4xl font-extrabold tracking-tight ${deficit > 80 ? 'text-rose-500' : 'text-[#6A1B1A]'}`}>
                                {deficit}%
                            </span>
                            <span className="text-[10px] text-slate-500 uppercase tracking-widest mt-1 font-bold">
                                Filter Density
                            </span>
                        </div>

                        {/* Interactive trigger */}
                        <div className="w-full max-w-sm space-y-3 text-center">
                            <button 
                                onClick={triggerScan}
                                className="w-full bg-gradient-to-r from-[#6A1B1A] to-[#802423] hover:from-[#521413] text-white font-bold text-xs py-2.5 px-4 rounded-lg shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2"
                            >
                                <i data-lucide="zap" className="w-4 h-4 text-[#E8B53D]"></i>
                                Simulate User Landing on Content
                            </button>
                            <p className="text-[10px] text-slate-500 font-medium">
                                {timerCount > 0 && isCounting 
                                    ? "Evaluating user interface... Attention depletion active."
                                    : "Attention exhausted. Core filter active: Ad content ignored."}
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        // --- EXTRA PANEL 2: GAME HUB (CLASSROOM ACTIVITIES) ---
        function ClassActivityPanel() {
            const [selectedProduct, setSelectedProduct] = useState(TRADITIONAL_PRODUCTS[0]);
            const [timerTime, setTimerTime] = useState(420); // 7 mins in secs
            const [timerActive, setTimerActive] = useState(false);
            const [teams, setTeams] = useState([
                { name: "Agency Alpha", product: "Dental Floss", score: 0 },
                { name: "Agency Beta", product: "Standard Pencil", score: 0 }
            ]);
            const [newTeamName, setNewTeamName] = useState("");

            // Timer management
            useEffect(() => {
                let interval;
                if (timerActive && timerTime > 0) {
                    interval = setInterval(() => {
                        setTimerTime(t => t - 1);
                    }, 1000);
                } else if (timerTime === 0) {
                    setTimerActive(false);
                }
                return () => clearInterval(interval);
            }, [timerActive, timerTime]);

            const rollProduct = () => {
                const randomProduct = TRADITIONAL_PRODUCTS[Math.floor(Math.random() * TRADITIONAL_PRODUCTS.length)];
                setSelectedProduct(randomProduct);
            };

            const toggleTimer = () => setTimerActive(!timerActive);
            const resetTimer = () => {
                setTimerActive(false);
                setTimerTime(420);
            };

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${m}:${s < 10 ? '0' : ''}${s}`;
            };

            const addNewTeam = (e) => {
                e.preventDefault();
                if (!newTeamName.trim()) return;
                setTeams([...teams, { name: newTeamName, product: selectedProduct, score: 0 }]);
                setNewTeamName("");
            };

            const incrementScore = (idx) => {
                const copy = [...teams];
                copy[idx].score += 1;
                setTeams(copy);
            };

            const decrementScore = (idx) => {
                const copy = [...teams];
                if (copy[idx].score > 0) {
                    copy[idx].score -= 1;
                    setTeams(copy);
                }
            };

            return (
                <div className="flex-1 flex flex-col xl:flex-row gap-6 p-4 lg:p-6 overflow-y-auto">
                    {/* Left Column: Activity Layout & Rules */}
                    <div className="flex-1 bg-white border border-[#E8B53D]/30 rounded-2xl p-6 flex flex-col justify-between shadow-md">
                        <div>
                            <div className="flex items-center gap-2 mb-4">
                                <span className="bg-[#6A1B1A]/10 text-[#6A1B1A] text-xs font-bold uppercase tracking-widest px-2.5 py-1 rounded-full border border-[#6A1B1A]/20">
                                    Classroom Challenge
                                </span>
                                <h2 className="text-xl font-extrabold text-[#6A1B1A]">The 8-Second Attention Hijack</h2>
                            </div>

                            <p className="text-sm text-slate-700 leading-relaxed mb-4">
                                Divide your class into integrated marketing agencies. Each agency is assigned a boring, everyday commoditized object. They have exactly <strong className="text-[#6A1B1A]">7 minutes</strong> to outline an integrated launch strategy.
                            </p>

                            {/* Rules stepper */}
                            <div className="space-y-3 mb-6">
                                <div className="flex gap-3 items-start text-xs bg-[#FFFBF0] p-3 rounded-xl border border-[#E8B53D]/40">
                                    <span className="bg-[#E8B53D]/25 text-[#6A1B1A] font-bold font-mono h-6 w-6 rounded flex items-center justify-center flex-shrink-0">1</span>
                                    <div>
                                        <h4 className="font-extrabold text-[#6A1B1A] mb-0.5">The Native Hook (Paid/Shared)</h4>
                                        <p className="text-slate-600 font-medium">Design a 5-second scroll-stopping TikTok video idea specifically tailored to hook a modern attention span.</p>
                                    </div>
                                </div>
                                <div className="flex gap-3 items-start text-xs bg-[#FFFBF0] p-3 rounded-xl border border-[#E8B53D]/40">
                                    <span className="bg-[#E8B53D]/25 text-[#6A1B1A] font-bold font-mono h-6 w-6 rounded flex items-center justify-center flex-shrink-0">2</span>
                                    <div>
                                        <h4 className="font-extrabold text-[#6A1B1A] mb-0.5">The Quiz Bridge (Owned)</h4>
                                        <p className="text-slate-600 font-medium">Develop a custom landing page or zero-party quiz concept to capture consumer data cleanly without cookies.</p>
                                    </div>
                                </div>
                                <div className="flex gap-3 items-start text-xs bg-[#FFFBF0] p-3 rounded-xl border border-[#E8B53D]/40">
                                    <span className="bg-[#E8B53D]/25 text-[#6A1B1A] font-bold font-mono h-6 w-6 rounded flex items-center justify-center flex-shrink-0">3</span>
                                    <div>
                                        <h4 className="font-extrabold text-[#6A1B1A] mb-0.5">The Physical Anchor (Experiential)</h4>
                                        <p className="text-slate-600 font-medium">Sketch a downtown guerrilla pop-up concept matching the product theme to convert digital engagement into real-world traffic.</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Interactive Product Randomizer (Mustard Highlight Callout Box) */}
                        <div className="bg-[#E8B53D]/10 p-4 rounded-xl border border-[#E8B53D] mt-auto">
                            <span className="text-[10px] font-bold text-slate-500 uppercase tracking-widest block mb-2">Campaign Product Assigner</span>
                            <div className="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4">
                                <div>
                                    <h4 className="text-xs text-slate-500 font-semibold">Active Product To Target:</h4>
                                    <span className="text-lg font-extrabold text-[#6A1B1A] bg-gradient-to-r from-[#6A1B1A] to-[#802423] text-transparent bg-clip-text">
                                        {selectedProduct}
                                    </span>
                                </div>
                                <button 
                                    onClick={rollProduct}
                                    className="bg-white border border-[#E8B53D] hover:bg-slate-50 text-[#6A1B1A] text-xs font-bold px-4 py-2.5 rounded-lg flex items-center justify-center gap-1.5 transition-all"
                                >
                                    <i data-lucide="refresh-cw" className="w-3.5 h-3.5"></i>
                                    Roll Random Product
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Right Column: Timer & Presentation Scorekeeping */}
                    <div className="w-full xl:w-[400px] flex flex-col gap-6">
                        {/* Countdown card */}
                        <div className="bg-white border border-[#E8B53D]/30 rounded-2xl p-6 flex flex-col items-center justify-center text-center shadow-md">
                            <span className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Agency Workshop Timer</span>
                            <div className="text-5xl font-mono font-black text-[#6A1B1A] tracking-wider mb-4 drop-shadow-[0_0_8px_rgba(106,27,26,0.15)]">
                                {formatTime(timerTime)}
                            </div>
                            <div className="flex gap-2">
                                <button 
                                    onClick={toggleTimer}
                                    className={`px-4 py-2 rounded-lg text-xs font-extrabold flex items-center gap-1.5 transition-all ${timerActive ? 'bg-amber-500/15 border border-amber-500/30 text-amber-600 hover:bg-amber-500/25' : 'bg-[#E8B53D] hover:bg-[#d4a22e] text-[#6A1B1A] shadow'}`}
                                >
                                    <i data-lucide={timerActive ? "pause" : "play"} className="w-4 h-4"></i>
                                    {timerActive ? "Pause Workshop" : "Start 7-Min Timer"}
                                </button>
                                <button 
                                    onClick={resetTimer}
                                    className="px-3 py-2 bg-white hover:bg-slate-100 border border-slate-300 text-slate-550 rounded-lg text-xs font-semibold transition-all"
                                >
                                    Reset
                                </button>
                            </div>
                        </div>

                        {/* Agency Scoring System */}
                        <div className="bg-white border border-[#E8B53D]/30 rounded-2xl p-6 flex-1 flex flex-col justify-between shadow-md">
                            <div>
                                <div className="border-b border-slate-200 pb-3 mb-4">
                                    <h3 className="font-extrabold text-sm text-[#6A1B1A] uppercase tracking-wider">Agency Evaluation Portal</h3>
                                    <p className="text-[10px] text-slate-500 mt-0.5">Pitch: 60 Seconds per group. Track votes here.</p>
                                </div>

                                <div className="space-y-2 max-h-[220px] overflow-y-auto mb-4 pr-1">
                                    {teams.map((team, idx) => (
                                        <div key={idx} className="bg-[#FFFBF0] p-3 rounded-lg border border-[#E8B53D]/30 flex items-center justify-between gap-4">
                                            <div className="min-w-0">
                                                <h4 className="text-xs font-bold text-slate-800 truncate">{team.name}</h4>
                                                <span className="text-[9px] text-slate-500 font-semibold">Target: {team.product}</span>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <button 
                                                    onClick={() => decrementScore(idx)}
                                                    className="w-6 h-6 rounded bg-white border border-slate-300 hover:border-[#E8B53D] text-slate-600 hover:text-[#6A1B1A] flex items-center justify-center text-sm"
                                                >
                                                    -
                                                </button>
                                                <span className="font-mono text-xs font-bold text-[#6A1B1A] min-w-[20px] text-center">
                                                    {team.score}
                                                </span>
                                                <button 
                                                    onClick={() => incrementScore(idx)}
                                                    className="w-6 h-6 rounded bg-white border border-slate-300 hover:border-[#E8B53D] text-slate-600 hover:text-[#6A1B1A] flex items-center justify-center text-sm"
                                                >
                                                    +
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Add team sub-form */}
                            <form onSubmit={addNewTeam} className="flex gap-2">
                                <input 
                                    type="text" 
                                    placeholder="Enter Agency Name..." 
                                    value={newTeamName}
                                    onChange={(e) => setNewTeamName(e.target.value)}
                                    className="flex-1 bg-[#FFFBF0] border border-[#E8B53D]/30 rounded-lg px-3 py-2 text-xs text-slate-800 focus:outline-none focus:border-[#E8B53D]"
                                />
                                <button 
                                    type="submit"
                                    className="bg-[#6A1B1A] hover:bg-[#521413] text-white text-xs px-3 py-2 rounded-lg font-bold flex items-center gap-1 transition-all"
                                >
                                    <i data-lucide="plus" className="w-3.5 h-3.5 text-[#E8B53D]"></i>
                                    Add Agency
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        // --- EXTRA PANEL 3: CASE STUDIES PORTAL ---
        function CaseStudiesPanel() {
            const [selectedBrand, setSelectedBrand] = useState(0);

            return (
                <div className="flex-1 flex flex-col lg:flex-row gap-6 p-4 lg:p-6 overflow-y-auto">
                    {/* Brand List Panel */}
                    <div className="w-full lg:w-[320px] bg-white border border-[#E8B53D]/35 rounded-2xl p-4 flex flex-col gap-3 shadow-md">
                        <div className="border-b border-slate-200 pb-2 mb-2">
                            <h3 className="font-extrabold text-sm text-[#6A1B1A] uppercase tracking-wider">Real-World Case Modules</h3>
                            <p className="text-[10px] text-slate-500 mt-0.5">Toggle campaigns to explore strategic implementations.</p>
                        </div>

                        {BRAND_EXAMPLES.map((brand, idx) => (
                            <button
                                key={idx}
                                onClick={() => setSelectedBrand(idx)}
                                className={`w-full text-left p-3.5 rounded-xl border transition-all duration-200 flex flex-col gap-1.5 ${selectedBrand === idx ? 'bg-[#FFFBF0] border-[#E8B53D] shadow-sm' : 'bg-slate-50 border-slate-200 hover:border-[#E8B53D]/50'}`}
                            >
                                <div className="flex items-center justify-between w-full">
                                    <span className="text-xs font-black text-slate-800">{brand.name}</span>
                                    <i data-lucide="chevron-right" className="w-4 h-4 text-slate-400"></i>
                                </div>
                                <span className="text-[10px] text-[#6A1B1A] font-bold leading-tight">{brand.tagline}</span>
                            </button>
                        ))}
                    </div>

                    {/* Active Brand Details Deck */}
                    <div className="flex-1 bg-white border border-[#E8B53D]/35 rounded-2xl p-6 flex flex-col justify-between shadow-md">
                        <div>
                            <div className="flex items-center justify-between border-b border-slate-200 pb-3 mb-4">
                                <div>
                                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest block">Active Case Target</span>
                                    <h2 className="text-xl font-extrabold text-[#6A1B1A] mt-0.5">
                                        {BRAND_EXAMPLES[selectedBrand].name}
                                    </h2>
                                </div>
                                <span className="text-[9px] font-bold text-[#6A1B1A] bg-[#FFFBF0] border border-[#E8B53D]/40 px-2.5 py-1 rounded">
                                    {BRAND_EXAMPLES[selectedBrand].tagline}
                                </span>
                            </div>

                            <p className="text-sm text-slate-750 leading-relaxed mb-6 bg-[#FFFBF0] p-4 rounded-xl border border-[#E8B53D]/30 italic font-medium">
                                "{BRAND_EXAMPLES[selectedBrand].summary}"
                            </p>

                            <div className="space-y-4">
                                <h3 className="text-xs font-bold text-slate-500 uppercase tracking-wider">Execution Breakdown:</h3>
                                {BRAND_EXAMPLES[selectedBrand].details.map((detail, index) => (
                                    <div key={index} className="flex gap-3.5 items-start bg-slate-50 p-3 rounded-lg border border-[#E8B53D]/10">
                                        <div className="bg-[#E8B53D]/10 text-[#6A1B1A] font-bold text-xs h-5 w-5 rounded flex items-center justify-center flex-shrink-0 mt-0.5">
                                            {index + 1}
                                        </div>
                                        <div>
                                            <h4 className="text-xs font-extrabold text-slate-800 mb-1">{detail.split(':')[0]}</h4>
                                            <p className="text-xs text-slate-650 leading-relaxed">{detail.split(':')[1] || detail}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Interactive Discussion Prompt Box (Mustard Accent Callout) */}
                        <div className="mt-8 bg-[#E8B53D]/10 p-4 rounded-xl border border-[#E8B53D] flex items-start gap-3">
                            <div className="p-2 bg-[#6A1B1A]/10 rounded text-[#6A1B1A] flex-shrink-0">
                                <i data-lucide="help-circle" className="w-5 h-5 text-[#6A1B1A]"></i>
                            </div>
                            <div>
                                <h4 className="text-xs font-extrabold text-[#6A1B1A] mb-1">Class Discussion Prompt:</h4>
                                <p className="text-xs text-slate-700 leading-relaxed font-semibold">
                                    {selectedBrand === 0 
                                        ? "How did the CeraVe campaign manage the critical balance of using chaotic internet comedy while still maintaining their dermatologist-backed medical authority?"
                                        : "How did Liquid Death package a basic commodity so uniquely that the packaging itself became an ongoing physical advertisement, reducing direct media acquisition spend?"}
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- EXTRA PANEL 4: YOUTUBE MEDIA CENTER ---
        function YouTubeResourcesPanel() {
            const [copiedIndex, setCopiedIndex] = useState(null);

            const searchPrompts = [
                {
                    topic: "CeraVe Michael Cera Breakdown",
                    query: "CeraVe Michael Cera Super Bowl campaign case study",
                    usage: "Demonstrates high-production humor unified with a complex digital creator launch sequence.",
                    metric: "Earned Media Focus"
                },
                {
                    topic: "Liquid Death Strategic Analysis",
                    query: "Liquid Death marketing strategy breakdown how they built a billion dollar brand",
                    usage: "Illustrates disruptive brand building using packaging innovations and social campaigns with low TV spend.",
                    metric: "Shared & Owned Media Focus"
                },
                {
                    topic: "Advertising Evolution Timeline",
                    query: "The evolution of advertising from Mad Men to digital programmatic",
                    usage: "Visualizes the structural transition from legacy, broadcast silos to programmatic data integration.",
                    metric: "Silo vs. Ecosystem Context"
                },
                {
                    topic: "Nike Experiential Design Integration",
                    query: "Nike House of Innovation experiential retail design and digital integration",
                    usage: "Examines how physical locations act as direct conversion extensions for unified customer data profiles.",
                    metric: "Physical Omnichannel Anchoring"
                },
                {
                    topic: "Customer Data Platforms Explained",
                    query: "What is a Customer Data Platform CDP and why does marketing need it",
                    usage: "Explains structural database consolidation and why cookies are fading from modern campaigns.",
                    metric: "Marketing Automation Foundations"
                }
            ];

            const handleCopy = (query, idx) => {
                // Clipboard API fallback helper
                const tempInput = document.createElement("input");
                tempInput.value = query;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand("copy");
                document.body.removeChild(tempInput);
                
                setCopiedIndex(idx);
                setTimeout(() => setCopiedIndex(null), 2000);
            };

            return (
                <div className="flex-1 bg-[#FFFBF0] p-4 lg:p-6 flex flex-col overflow-y-auto">
                    <div className="max-w-4xl mx-auto w-full bg-white border border-[#E8B53D]/30 rounded-2xl p-6 flex flex-col shadow-md">
                        <div className="border-b border-slate-200 pb-3 mb-6">
                            <h2 className="text-xl font-extrabold text-[#6A1B1A] flex items-center gap-2">
                                <i data-lucide="youtube" className="text-red-600 w-6 h-6"></i>
                                Integrated Lecture Video Hub
                            </h2>
                            <p className="text-xs text-slate-500 mt-1 font-semibold">
                                Simply click any button below to copy the exact search query. Paste it directly into YouTube to locate matching campaigns or expert analyses.
                            </p>
                        </div>

                        <div className="space-y-4">
                            {searchPrompts.map((prompt, idx) => (
                                <div 
                                    key={idx}
                                    className="bg-slate-50 p-4 rounded-xl border border-[#E8B53D]/10 hover:border-[#E8B53D]/30 transition-all flex flex-col md:flex-row md:items-center justify-between gap-4 shadow-sm"
                                >
                                    <div className="space-y-1.5 min-w-0 flex-1">
                                        <div className="flex items-center gap-2">
                                            <span className="text-xs font-black text-slate-800">{prompt.topic}</span>
                                            <span className="text-[8px] font-bold text-[#6A1B1A] bg-[#FFFBF0] px-1.5 py-0.5 rounded border border-[#E8B53D]/40 uppercase">
                                                {prompt.metric}
                                            </span>
                                        </div>
                                        <p className="text-xs text-slate-600 leading-relaxed">
                                            <strong className="text-slate-700">Classroom Context:</strong> {prompt.usage}
                                        </p>
                                        <div className="font-mono text-[10px] text-[#6A1B1A] font-bold bg-[#E8B53D]/15 py-1 px-2 rounded border border-[#E8B53D]/25 inline-block truncate max-w-full">
                                            Query: "{prompt.query}"
                                        </div>
                                    </div>

                                    <button 
                                        onClick={() => handleCopy(prompt.query, idx)}
                                        className={`px-4 py-2.5 rounded-lg text-xs font-bold flex items-center justify-center gap-1.5 transition-all w-full md:w-auto flex-shrink-0 ${copiedIndex === idx ? 'bg-emerald-500/10 border border-emerald-500/20 text-emerald-600' : 'bg-[#6A1B1A] hover:bg-[#521413] text-white'}`}
                                    >
                                        <i data-lucide={copiedIndex === idx ? "check" : "copy"} className="w-3.5 h-3.5 text-[#E8B53D]"></i>
                                        {copiedIndex === idx ? "Query Copied!" : "Copy Search Query"}
                                    </button>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // --- BOOTSTRAP REACT APP ---
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);

        // Global initialization call for Lucide icons
        setTimeout(() => {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }, 500);
    </script>
</body>
